[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-shower-system"
version = "0.1.0"
description = "Serverless payment and activation service for a marina shower."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
dev = [
    "black>=23.3,<25",
    "mypy>=1.3,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

